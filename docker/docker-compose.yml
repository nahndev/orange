services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    mem_limit: 512m
    environment:
      POSTGRES_USER: orange
      POSTGRES_PASSWORD: orange
      POSTGRES_DB: orange
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.9
    restart: "no"
    mem_limit: 512m
    environment:
      MEILI_MASTER_KEY: changeme
    ports:
      - "7701:7700"
    volumes:
      - meilisearch-data:/meili_data

  ollama:
    image: ollama/ollama:latest
    restart: "no"
    mem_limit: 4g
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  meilisearch-data:
  ollama-data:
